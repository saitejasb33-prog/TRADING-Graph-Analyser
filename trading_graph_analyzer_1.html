<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Graph Analyzer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root {
    --bg: #0b0e14;
    --panel: #12161f;
    --panel-border: #232838;
    --text: #e6e9f0;
    --muted: #7c8296;
    --up: #2fe08a;
    --down: #ff5c72;
    --accent: #4d7bff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }

  .app { width: 100%; max-width: 760px; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 14px;
  }

  header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.5px;
  }

  header h1 span { color: var(--accent); }

  header .ticker-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 16px;
  }

  .panel-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  textarea {
    width: 100%;
    background: #0d1017;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 10px;
    resize: vertical;
    min-height: 60px;
  }

  textarea:focus { outline: none; border-color: var(--accent); }

  .run-btn {
    margin-top: 12px;
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 11px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .run-btn:hover { opacity: 0.85; }
  .run-btn:active { transform: translateY(1px); }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }

  .stat {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 12px;
    text-align: left;
  }

  .stat .k {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .stat .v {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px;
    font-weight: 700;
  }

  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--muted); }

  .chart-panel canvas { width: 100% !important; }

  footer {
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    margin-top: 18px;
    letter-spacing: 0.5px;
  }

  @media (max-width: 480px) {
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>TRADING<span>/</span>ANALYZER</h1>
    <div class="ticker-label">SIMPLE SMA VIEWER</div>
  </header>

  <div class="panel">
    <div class="panel-label">Price Series (comma-separated)</div>
    <textarea id="prices">100, 102, 101, 105, 110, 108, 115, 120, 118, 125</textarea>
    <button class="run-btn" onclick="analyze()">RUN ANALYSIS</button>
  </div>

  <div class="stat-grid" id="stats"></div>

  <div class="panel chart-panel">
    <div class="panel-label">Price / SMA(3)</div>
    <canvas id="chart" height="200"></canvas>
  </div>

  <footer>NOT FINANCIAL ADVICE — FOR ILLUSTRATION ONLY</footer>
</div>

<script>
let chart;

function analyze() {
  const raw = document.getElementById('prices').value;
  const data = raw.split(',').map(v => parseFloat(v.trim())).filter(v => !isNaN(v));

  if (data.length < 2) {
    alert('Enter at least 2 valid numbers.');
    return;
  }

  const win = 3;
  const sma = data.map((_, i) => {
    if (i < win - 1) return null;
    const slice = data.slice(i - win + 1, i + 1);
    return slice.reduce((a, b) => a + b, 0) / win;
  });

  const change = data[data.length - 1] - data[0];
  const pctChange = ((change / data[0]) * 100).toFixed(2);
  const trendClass = change > 0 ? 'up' : change < 0 ? 'down' : 'flat';
  const trendLabel = change > 0 ? '▲ UPTREND' : change < 0 ? '▼ DOWNTREND' : '— FLAT';
  const max = Math.max(...data);
  const min = Math.min(...data);

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="k">Trend</div><div class="v ${trendClass}">${trendLabel}</div></div>
    <div class="stat"><div class="k">Change</div><div class="v ${trendClass}">${change.toFixed(2)} (${pctChange}%)</div></div>
    <div class="stat"><div class="k">High</div><div class="v up">${max}</div></div>
    <div class="stat"><div class="k">Low</div><div class="v down">${min}</div></div>
  `;

  const labels = data.map((_, i) => i + 1);
  const lineColor = change >= 0 ? '#2fe08a' : '#ff5c72';

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        {
          label: 'Price',
          data: data,
          borderColor: lineColor,
          backgroundColor: lineColor + '22',
          fill: true,
          tension: 0.25,
          pointRadius: 2,
          borderWidth: 2
        },
        {
          label: 'SMA (3)',
          data: sma,
          borderColor: '#4d7bff',
          borderDash: [4, 3],
          tension: 0.25,
          pointRadius: 0,
          borderWidth: 1.5
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { color: '#7c8296', font: { family: 'JetBrains Mono', size: 11 } } }
      },
      scales: {
        x: { ticks: { color: '#7c8296', font: { size: 10 } }, grid: { color: '#232838' } },
        y: { ticks: { color: '#7c8296', font: { size: 10 } }, grid: { color: '#232838' } }
      }
    }
  });
}

analyze();
</script>

</body>
</html>
